<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GrandhaShare{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}"><i class="bi bi-book-half me-2"></i>GrandhaShare</a>
            <div class="ms-auto d-flex align-items-center gap-2">
              {% if user.is_authenticated %}
                 <span class="navbar-text me-2">Hi, {{ user.username }}</span>
                 <form method="post" action="{% url 'logout' %}" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
                 </form>
              {% else %}
                <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Log in</a>
                <a class="btn btn-light btn-sm" href="{% url 'signup' %}">Sign up</a>
              {% endif %}
           </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
