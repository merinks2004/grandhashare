{% extends "base.html" %}

{% block title %}Delete book - GrandhaShare{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body text-center p-4">
                <h4 class="mb-2">Delete this book?</h4>
                <p class="text-muted">"{{ listing.title }}" will be removed permanently.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, delete</button>
                    <a href="{% url 'my_listings' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
