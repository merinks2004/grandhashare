{% extends "base.html" %}

{% block title %}Request {{ listing.title }} - GrandhaShare{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <a href="{% url 'listing_detail' listing.pk %}" class="text-decoration-none small">&larr; Back to book</a>
        <div class="card border-0 shadow-sm mt-2">
            <div class="card-body p-4">
                <h4 class="mb-1">Request this book</h4>
                <p class="text-muted">{{ listing.title }} &middot; by {{ listing.seller.username }}</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.message.id_for_label }}">Message to the seller (optional)</label>
                        {{ form.message }}
                    </div>
                    <button type="submit" class="btn btn-primary">Send request</button>
                    <a href="{% url 'listing_detail' listing.pk %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
